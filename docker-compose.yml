services:
  idor-workbench:
    build: .
    ports:
      - "8001:8001"
    environment:
      IDOR_TASK_WORKERS: "2"
      IDOR_CORS_ORIGINS: "http://localhost:8001,http://127.0.0.1:8001"
      IDOR_AI_PROVIDER: "ollama"
      IDOR_AI_BASE_URL: "http://host.docker.internal:11434"
      IDOR_AI_MODEL: "qwen3:8b"
      IDOR_AI_TIMEOUT: "180"
    volumes:
      - ./data:/app/data
      - ./fetchapihar:/app/fetchapihar
      - ./api_tool:/app/api_tool
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
